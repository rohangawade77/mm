<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7 Jan">
<title>Road to 7 January</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b2c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='white'%3E7%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1014; --card:#171a21; --card2:#1f232c; --line:#2a2f3a;
  --text:#f3f4f6; --muted:#9aa3b2;
  --orange:#ff6b2c; --lime:#a3e635; --blue:#38bdf8; --red:#f43f5e; --gold:#fbbf24; --purple:#a78bfa;
  --run:#ff6b2c; --walk:#0ea5a4;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
h1,h2,h3{margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header .in{max-width:560px;margin:0 auto}
.hname{font-weight:800;font-size:15px}
.hstats{display:flex;gap:12px;font-size:13px;font-weight:700;color:var(--muted)}
.hstats b{color:var(--text)}
.xpbar{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:9px;transition:width .6s}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h3{font-size:17px;margin-bottom:6px}
.hero{margin-top:14px;border-radius:24px;padding:20px;background:radial-gradient(120% 120% at 100% 0%,#3a1d10 0%,#1a1410 45%,var(--card) 100%);border:1px solid #3a2a20;position:relative;overflow:hidden}
.hero .big{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px}
.hero .lab{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
.hero .cake{position:absolute;right:14px;top:10px;font-size:54px;opacity:.9}
.phase{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(255,107,44,.15);color:#ffb08a}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#111}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.lnk{color:var(--blue);font-weight:700;font-size:13px;padding:6px 4px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip.on{background:rgba(255,107,44,.18);border-color:var(--orange);color:#fff}
.q{font-weight:700;font-size:14px;margin-top:4px}

/* tasks */
.task{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-top:10px}
.task.done{opacity:.75;border-color:#2f4a1a}
.task .te{font-size:30px;line-height:1}
.task .tt{font-weight:800;font-size:16px}
.task .td{color:var(--muted);font-size:14px;margin-top:4px}
.task .ta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.task .tadj{font-size:12px;color:var(--gold);margin-top:6px}
.xp{display:inline-block;font-size:12px;font-weight:800;color:var(--gold);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:7px 11px;border-radius:99px}
.pill.ok{background:rgba(163,230,53,.15);color:var(--lime)}
.pill.bad{background:rgba(244,63,94,.15);color:#fda4af}
.pill.info{background:rgba(56,189,248,.15);color:#7dd3fc}
.lock{font-size:13px;color:var(--muted);font-weight:700}
.k-long{border-color:#5b3a1e;background:linear-gradient(135deg,#2a1d14,var(--card2))}
.k-race{border-color:var(--gold);background:linear-gradient(135deg,#3b2c0a,var(--card2))}
.k-boss{border-color:#5b3fa0;background:linear-gradient(135deg,#231a3a,var(--card2))}

.verdict{border-left:4px solid var(--lime)}
.verdict.amber{border-left-color:var(--gold)}
.verdict.red{border-left-color:var(--red)}
.verdict ul{margin:6px 0 0;padding-left:18px}
.verdict li{margin:4px 0}

/* journey */
.prog{height:14px;border-radius:9px;background:var(--card2);position:relative;margin:26px 0 8px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--orange),var(--gold))}
.prog .me{position:absolute;top:-24px;font-size:22px;transform:translateX(-50%)}
.prog .fin{position:absolute;right:-4px;top:-24px;font-size:22px}
.wk{margin-top:18px}
.wk h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.day{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-top:6px}
.day.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.day .dd{width:78px;font-size:13px;font-weight:700;color:var(--muted)}
.day .dt{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ds{font-size:18px}

/* stats */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;background:var(--card2);border-radius:14px;padding:10px 4px}
.bdg .e{font-size:28px}
.bdg .n{font-size:11px;font-weight:800;margin-top:4px}
.bdg.off{opacity:.3;filter:grayscale(1)}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .e{font-size:46px}

/* guide */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;padding:0 14px}
summary{padding:14px 0;font-weight:800;list-style:none;cursor:pointer}
summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
details .body{padding-bottom:14px;color:#d6dae2;font-size:15px}
details table{width:100%;border-collapse:collapse;font-size:14px}
details td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.check .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.check.on .bx{background:var(--lime);border-color:var(--lime);color:#111}
.check.on span:last-child{color:var(--muted);text-decoration:line-through}

/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
nav button .i{font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--text)}
nav button.on .i{filter:none;opacity:1}

/* sheet */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease}
#sheet.open{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet .in{max-width:560px;margin:0 auto}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--orange)}
.rpe{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* timer */
#timer{position:fixed;inset:0;z-index:60;display:none;background:var(--run);color:#fff;transition:background .4s}
#timer.walk{background:var(--walk)}
#timer.done{background:#16a34a}
#timer.paused{background:#3f3f46}
.tm{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.tm-top{display:flex;align-items:center;gap:10px}
.tm-top button{font-size:22px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.18)}
.tm-title{flex:1;text-align:center;font-weight:800;font-size:15px;opacity:.95}
.tm-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tm-phase{font-size:64px;font-weight:900;letter-spacing:2px;line-height:1}
.tm-count{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:6px}
.tm-sub{font-size:17px;font-weight:700;opacity:.9;margin-top:8px}
.tm-bar{height:10px;background:rgba(0,0,0,.2);border-radius:9px;overflow:hidden;width:100%;margin-top:20px}
.tm-bar i{display:block;height:100%;background:#fff;border-radius:9px}
.tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;width:100%}
.tm-grid div{background:rgba(0,0,0,.16);border-radius:14px;padding:10px}
.tm-grid b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tm-grid span{font-size:12px;font-weight:700;opacity:.85}
.tm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm-btns button{padding:16px;border-radius:16px;background:rgba(0,0,0,.2);font-weight:800;font-size:17px}
.tm-btns button.primary{background:#fff;color:#111}
.tm-btns button.wide{grid-column:1/-1}
.tm-tip{text-align:center;font-size:12px;opacity:.8;margin:10px 0 0}

/* misc */
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.cert{margin-top:14px;border-radius:24px;padding:24px 20px;text-align:center;background:linear-gradient(160deg,#3b2c0a,#1b1508 60%,#111);border:2px solid var(--gold)}
.cert h2{font-size:30px;margin:8px 0}
.cert .km{font-size:56px;font-weight:900;color:var(--gold);line-height:1}
.celebrate{text-align:center}
.celebrate .xpbig{font-size:54px;font-weight:900;color:var(--gold)}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.onb h1{font-size:40px;letter-spacing:-1px}
.onb .rule{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.onb .rule b{font-size:26px}
.sep{height:1px;background:var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheetBg" data-a="sheet-close"></div>
<div id="sheet"><div class="grab"></div><div class="in" id="sheetIn"></div></div>
<div id="timer"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
'use strict';
/* =====================================================================
   ROAD TO 7 JANUARY: a marathon training game.
   Single-user, offline-first. All progress is stored on this device.
   ===================================================================== */

const START = '2026-09-26';        // setup weekend (Sat)
const W1 = '2026-09-28';           // Monday of week 1
const BIRTHDAY = '2027-01-07';     // Thursday: race day
const KEY = 'road7jan.v1';
const Q = new URLSearchParams(location.search);

/* ---------------- dates (all as 'YYYY-MM-DD', calendar maths in UTC) */
const pad = n => String(n).padStart(2, '0');
const dn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const ds = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const add = (s, k) => ds(dn(s) + k);
const wd = s => new Date(dn(s) * 864e5).getUTCDay();
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = s => { const [, m, d] = s.split('-').map(Number); return DOW[wd(s)] + ' ' + d + ' ' + MON[m - 1]; };
const fmtLong = s => { const [y, m, d] = s.split('-').map(Number); return DOWL[wd(s)] + ' ' + d + ' ' + MON[m - 1] + ' ' + y; };
function today() {
  const o = Q.get('date');
  if (o && /^\d{4}-\d\d-\d\d$/.test(o)) return o;           // preview/testing: ?date=2026-11-28
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fm = m => (m % 1 ? Math.floor(m) + '½' : m) + ' min';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x); };
const hmin = min => { min = Math.round(min || 0); const h = Math.floor(min / 60); return h ? h + 'h ' + pad(min % 60) + 'm' : min + ' min'; };

/* ---------------- state */
function defState() {
  return {
    v: 1, name: '', onboarded: false, mode: 'full', raceDate: BIRTHDAY,
    logs: {}, bosses: {}, seen: [], injuryUntil: null, injuryStart: null, riskAccepted: false,
    settings: { voice: true, beep: true, vibrate: true, gps: false, loopKm: 5, remind: '07:00' },
    raceChecklist: {}, timer: null, created: today()
  };
}
let S;
try { S = Object.assign(defState(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = defState(); }
S.settings = Object.assign(defState().settings, S.settings || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Could not save: storage blocked'); } }
const LG = d => S.logs[d] || (S.logs[d] = { tasks: {} });
const tl = (d, id) => S.logs[d] && S.logs[d].tasks && S.logs[d].tasks[id];
let TAB = 'today';

/* ---------------- task builders */
function tIv(r, w, n, o) { return Object.assign({ kind: 'intervals', iv: { run: r, walk: w, reps: n, warm: 5, cool: 5 }, min: 10 + Math.round(n * (r + w)), xp: 100, emoji: '🏃', title: `Run-walk · ${n} × (${fm(r)} run / ${fm(w)} walk)` }, o || {}); }
function tLongTime(total, r, w) { const n = Math.floor(total / (r + w)); return tIv(r, w, n, { long: true, xp: 150, emoji: '⛰️', title: `LONG run-walk · ${n * (r + w)} min (${fm(r)} run / ${fm(w)} walk)` }); }
function tRun(km, o) { return Object.assign({ kind: 'run', km, xp: Math.round(100 + 10 * km), emoji: '👟', title: `Easy run · ${km} km` }, o || {}); }
function tJog(min, o) { return Object.assign({ kind: 'run', min, xp: 80, emoji: '👟', title: `Easy jog · ${min} min` }, o || {}); }
function tLong(km, o) { return Object.assign({ kind: 'long', km, xp: Math.round(150 + 15 * km), emoji: '⛰️', title: `LONG RUN · ${km} km` }, o || {}); }
function tWalk(min, title) { return { kind: 'walk', min, xp: 40, emoji: '🚶', title: title || `Brisk walk · ${min} min` }; }
function tStr(light) { return { kind: 'strength', light: !!light, xp: light ? 40 : 60, emoji: '💪', title: light ? 'Light strength · 1–2 rounds' : 'Strength circuit · 3 rounds' }; }
function tRest(title, detail) { return { kind: 'rest', xp: 20, emoji: '😴', title: title || 'Rest day', detail }; }
function tRace(km) { return { kind: 'race', km, xp: 1000, emoji: '🎂', title: km > 40 ? 'BIRTHDAY MARATHON · 42.2 km' : 'BIRTHDAY HALF MARATHON · 21.1 km' }; }
function tBoss(n) { return { kind: 'boss', n, xp: 300, emoji: n === 1 ? '👾' : '🐉', title: `BOSS BATTLE · Checkpoint ${n}` }; }
function tPrep(title, items, xp) { return { kind: 'prep', title, items, xp: xp || 50, emoji: '🎒' }; }
const isRun = t => !!t && (t.kind === 'intervals' || t.kind === 'run' || t.kind === 'long' || t.kind === 'race');
const isLongT = t => !!t && (t.kind === 'long' || !!t.long);
const HALF = () => S.mode === 'half';
const raceKm = () => (HALF() ? 21.1 : 42.2);

/* ---------------- the training plan */
const P1 = { 1: [[1, 2, 8], [30, 1, 2], 30], 2: [[2, 2, 8], [40, 2, 2], 35], 3: [[3, 1.5, 7], [50, 3, 1], 40], 4: [[5, 1, 5], null, 0] };
const P2 = { 5: [5, 5, 8, 3], 6: [5, 6, 11, 3], 7: [6, 6, 14, 4], 8: [5, 5, 10, 3], 9: [6, 7, 16, 4], 10: [6, 7, 20, 4], 11: [6, 8, 24, 4], 12: [5, 7, 28, 3] };
const HALF_CAP = { 9: 14, 10: 16, 11: 18, 12: 19 };
const CP = { '2026-10-25': 1, '2026-11-22': 2 };
const weekOf = d => Math.floor((dn(d) - dn(W1)) / 7) + 1;

function basePlan(d) {
  const w = wd(d), T = [], n = dn(d), race = S.raceDate;
  let phase = '', note = '';
  if (n < dn(START)) {
    phase = 'Before the game';
    T.push(tRest('The game starts Sat 26 Sep', 'Get ready: shoes, app, calendar.'));
  } else if (d === race) {
    phase = 'RACE DAY';
    T.push(tRace(raceKm()));
  } else if (n > dn(race)) {
    phase = 'Recovery';
    const k = n - dn(race);
    const R = {
      1: tRest('Recovery day 1', 'Gentle walking, eat well, sleep. You earned it.'),
      2: tWalk(20, 'Recovery walk · 20 min'), 3: tRest('Recovery rest'),
      4: tWalk(30, 'Recovery walk · 30 min'), 5: tRest('Recovery rest'),
      6: tJog(15, { title: 'First jog back · 15 min very easy' }), 7: tWalk(30, 'Recovery walk · 30 min')
    };
    T.push(R[k] || tRest('Free play', 'Game complete! Run for fun whenever you like.'));
  } else if (n < dn(W1)) {
    phase = 'Setup weekend';
    if (d === START) T.push(tPrep('Setup mission', ['Get running shoes fitted at a running shop', 'Install Strava or Nike Run Club', 'Put your runs in your calendar (Me → Calendar reminders)', 'Add this app to your home screen', 'Tell one friend about your birthday marathon']), tWalk(30));
    else { T.push(tWalk(30), tStr(true)); note = 'Learn the strength moves: just 1 round today.'; }
  } else if (n >= dn('2026-12-21')) {
    phase = n >= dn('2027-01-04') ? 'Race week' : 'Taper';
    const h = HALF();
    const X = {

    const mins = Math.round(c.iv.reps * (c.iv.run + c.iv.walk));

  if (w === 1 && S.logs[add(d, -1)] && S.logs[add(d, -1)].moveLong) return '';
  const t = plan(sat).tasks.find(isLongT);
  if (!t || t.moved || isDone(sat, t)) return '';
  const r = tl(sat, t.id);
  if (r && r.status === 'skipped' && (r.reason === 'injured' || r.reason === 'ill')) return '';
  if (S.logs[sat] && S.logs[sat].adj && S.logs[sat].adj.type === 'rest') return '';
  return `<div class="card" style="border-color:#5b3a1e"><h3>⛰️ Missed Saturday’s long run?</h3><p class="muted small" style="margin:0 0 10px">“${esc(t.title)}” is the most important session of the week. The coach can move it to today${w === 0 ? ' (it replaces today’s short run)' : ''}.</p>
    <div class="row"><button class="btn primary" data-a="move-long" data-from="${sat}">Yes, do it today</button><button class="btn ghost" data-a="no-move">No, skip it</button></div></div>`;
}
function taskCard(d, t, opts) {
  opts = opts || {};
  const r = tl(d, t.id), T = today();
  const future = dn(d) > dn(T), past = dn(d) < dn(T);
  let act = '';
  if (t.moved) act = `<span class="pill info">↪ Moved to ${fmt(t.moved)}</span>`;
  else if (r && r.status === 'done') act = `<span class="pill ok">✅ Done · +${r.xp} XP${r.km ? ' · ' + r.km + ' km' : ''}${r.min ? ' · ' + hmin(r.min) : ''}</span><button class="lnk" data-a="undo" data-d="${d}" data-id="${t.id}">Undo</button>`;
  else if (r && r.status === 'skipped') act = `<span class="pill bad">Skipped · ${esc(r.reason)}</span><button class="lnk" data-a="undo" data-d="${d}" data-id="${t.id}">Undo</button>`;
  else if (future) act = `<span class="lock">🔒 Unlocks ${fmt(d)}</span>`;
  else if (t.kind === 'rest') act = past ? `<span class="pill ok">😴 Rested · +${t.xp} XP</span>` : `<button class="btn sm lime" data-a="claim" data-d="${d}" data-id="${t.id}">😴 I rested · claim +${t.xp} XP</button>`;
  else if (opts.locked && t.kind !== 'boss' && t.kind !== 'prep') act = `<span class="lock">🔒 Do your check-in first</span>`;
  else if (t.kind === 'boss') act = `<button class="btn primary sm" data-a="boss" data-d="${d}" data-id="${t.id}">⚔️ Fight the boss</button>`;
  else if (t.kind === 'prep') act = `<button class="btn primary sm" data-a="prep" data-d="${d}" data-id="${t.id}">📋 Open checklist</button>`;
  else if (t.kind === 'strength') act = `<button class="btn primary sm" data-a="str" data-d="${d}" data-id="${t.id}">💪 Open circuit</button><button class="btn sm" data-a="log" data-d="${d}" data-id="${t.id}">✍️ Log</button><button class="btn sm ghost" data-a="skip" data-d="${d}" data-id="${t.id}">Skip</button>`;
  else act = `${d === T ? `<button class="btn primary sm" data-a="start" data-d="${d}" data-id="${t.id}">▶ Start</button>` : ''}<button class="btn sm" data-a="log" data-d="${d}" data-id="${t.id}">✍️ Log it</button><button class="btn sm ghost" data-a="skip" data-d="${d}" data-id="${t.id}">Skip</button>`;
  return `<div class="task k-${t.kind}${t.long ? ' k-long' : ''}${r && r.status === 'done' ? ' done' : ''}">
    <div class="te">${t.emoji}</div><div class="grow"><div class="tt">${esc(t.title)}</div><div class="td">${esc(describe(t))}</div>
    ${t.movedFrom ? `<div class="tadj">↪ Moved from ${fmt(t.movedFrom)}</div>` : ''}
    ${t.origTitle ? `<div class="tadj">🧠 Coach adjusted this from: ${esc(t.origTitle)}</div>` : ''}
    ${r ? '' : `<span class="xp">+${t.xp} XP</span>`}
    <div class="ta">${act}</div></div></div>`;
}

function weekLabel(d) {
  const n = dn(d);
  if (n < dn(W1)) return 'Setup weekend';
  if (n > dn(S.raceDate)) return 'Recovery';

  if (wk <= 4) return 'Week ' + wk + ' · Build the habit';
  if (wk <= 12) return 'Week ' + wk + (wk === 12 ? ' · PEAK' : ' · Build distance');
  if (wk <= 14) return 'Week ' + wk + ' · Taper';
  return 'Race week';
}
function viewJourney() {
  const T = today(), total = dn(S.raceDate) - dn(START), el = clamp(dn(T) - dn(START), 0, total);
  const pct = total ? el / total * 100 : 0;
  const st = stats();

  let cur = '';

    const p = plan(d), s = dayStatus(d);

  }
  h += '</div>';
  return h;
}

function weekKm() {
  const out = [];
  for (let wk = 0; wk <= 15; wk++) {
    const from = wk === 0 ? dn(START) : dn(W1) + (wk - 1) * 7;
    const to = wk === 0 ? dn(W1) - 1 : from + 6;
    let act = 0, pl = 0;
    for (let n = from; n <= to; n++) {
      const d = ds(n); if (n > dn(S.raceDate)) break;
      for (const t of plan(d).tasks) { if (isRun(t) && t.km && !t.moved) pl += t.km; const r = tl(d, t.id); if (r && r.status === 'done' && r.km) act += +r.km; }
    }
    out.push({ wk, act, pl });
  }
  return out;
}
function viewStats() {

  const L = LG(d);

  const msgs = [];
  if (data.pain === 'sharp') { S.injuryUntil = add(d, 2); if (!S.injuryStart) S.injuryStart = d; msgs.push('🚨 Sharp pain logged. The coach will enforce rest for the next 2 days. See a physio if it’s on a bone or lasts 3+ days.'); }

  if (isRun(t) && t.km && data.km && data.km < t.km * 0.7 && t.kind !== 'race') msgs.push('Shorter than planned, no drama. Consistency beats heroics.');

}

    return { ok: need ? done / need >= 0.5 : false, text: `You completed ${done} of ${need} runs in weeks 3–4.` };
  }

}

/* ---------------- workout timer */
let PH = [], tInt = null, lastBeep = -1, wl = null, geoId = null, lastPos = null, lastSave = 0;
function phasesFor(t, mode) {
  const P = [], s = x => Math.round(x * 60);
  if (t.kind === 'intervals') {
    const v = t.iv;
    P.push({ type: 'walk', sec: s(v.warm), label: 'WARM-UP', say: 'Warm up. Brisk walk for five minutes.' });
    for (let i = 1; i <= v.reps; i++) {
      P.push({ type: 'run', sec: s(v.run), label: 'RUN', rep: i, of: v.reps, say: i === v.reps ? 'Last run! Go.' : 'Run.' });
      if (i < v.reps) P.push({ type: 'walk', sec: s(v.walk), label: 'WALK', rep: i, of: v.reps, say: 'Walk.' });
    }
    P.push({ type: 'walk', sec: s(v.cool), label: 'COOL-DOWN', say: 'Great work. Cool down, walk for five minutes.' });
    return P;
  }
  if (t.kind === 'walk') { P.push({ type: 'walk', sec: s(t.min), label: 'WALK', say: 'Brisk walk. Go.' }); return P; }
  if (t.kind !== 'race') P.push({ type: 'walk', sec: 300, label: 'WARM-UP', say: 'Warm up. Brisk walk for five minutes.' });
  if (mode === 'cont') { P.push({ type: 'run', sec: s(t.min || Math.max(20, (t.km || 5) * 8)), label: 'RUN', say: 'Easy run. Conversational pace.' }); return P; }
  for (let i = 1; i <= 300; i++) { P.push({ type: 'run', sec: 300, label: 'RUN', rep: i, say: 'Run.' }); P.push({ type: 'walk', sec: 60, label: 'WALK', rep: i, say: 'Walk. One minute.' }); }
  return P;
}
const fuelOn = t => t.kind === 'race' || (t.kind === 'long' && (t.km || 0) >= 12);
function startTimer(d, t, mode) {

  S.timer = { d, id: t.id, task: t, mode: mode || 'rw', start: Date.now(), paused: null, pausedMs: 0, skipMs: 0, idx: -1, fuel: 0, laps: 0, gps: 0 };
  save(); openTimer();
}
function openTimer() {
  const T = S.timer; if (!T) return;

    <div class="tm-mid"><div class="tm-phase" id="tmP">GO</div><div class="tm-count" id="tmC">00:00</div><div class="tm-sub" id="tmS"></div><div class="tm-bar"><i id="tmB"></i></div>
    <div class="tm-grid"><div><b id="tmE">00:00</b><span>total time</span></div><div><b id="tmK">–</b><span>km</span></div><div><b id="tmF">–</b><span>${fuelOn(T.task) ? 'next fuel' : 'target'}</span></div></div></div>
    <div class="tm-btns"><button data-a="t-pause" id="tmPause">⏸ Pause</button><button data-a="t-skip">⏭ Skip</button>
    ${showLap ? `<button class="wide" data-a="t-lap">🔁 Loop done (+${S.settings.loopKm} km)</button>` : ''}
    <button class="primary wide" data-a="t-finish">✅ Finish &amp; log</button></div>
    <p class="tm-tip">Keep this screen open. It stays awake and speaks your cues.</p></div>`;

const tEl = () => { const T = S.timer; return (T.paused || Date.now()) - T.start - T.pausedMs; };
function tick() {
  const T = S.timer; if (!T) return;
  const el = tEl(), eff = el + T.skipMs;
  let acc = 0, idx = PH.length, rem = 0, dur = 1;
  for (let i = 0; i < PH.length; i++) { const L = PH[i].sec * 1000; if (eff < acc + L) { idx = i; rem = acc + L - eff; dur = L; break; } acc += L; }
  if (idx !== T.idx) {
    const first = T.idx === -1; T.idx = idx; save();
    if (idx < PH.length) { const p = PH[idx]; say(p.say); beep(p.type === 'run' ? 880 : 520, .25); beep(p.type === 'run' ? 1175 : 440, .25, .3); buzz(p.type === 'run' ? [300, 100, 300] : [500]); }
    else if (!first || el > 1000) { say('Workout complete. Amazing job! Press finish to log it.'); beep(784, .2); beep(988, .2, .22); beep(1319, .4, .44); buzz([200, 80, 200, 80, 400]); }
  }
  if (!T.paused && idx < PH.length) { const sLeft = Math.ceil(rem / 1000); if (sLeft <= 3 && sLeft >= 1 && sLeft !== lastBeep) { lastBeep = sLeft; beep(660, .07); } }
  if (fuelOn(T.task) && !T.paused) {
    const m = el / 60000, due = m >= 30 ? Math.floor((m - 30) / 35) + 1 : 0;
    if (due > T.fuel) { T.fuel = due; save(); say('Fuel time. Take a gel and some water.'); buzz([150, 80, 150, 80, 150]); toast('🍌 Fuel time: gel + water'); }
  }
  if (Date.now() - lastSave > 10000) { lastSave = Date.now(); save(); }
  // draw
  const tm = $('#timer'), p = PH[idx];
  tm.className = T.paused ? 'paused' : (idx >= PH.length ? 'done' : (p.type === 'walk' ? 'walk' : ''));
  $('#tmP').textContent = T.paused ? 'PAUSED' : (idx >= PH.length ? 'DONE 🎉' : p.label);
  $('#tmC').textContent = idx >= PH.length ? '+' + hms(eff - acc) : hms(rem + 999);
  let sub = '';
  if (idx < PH.length) {
    if (p.rep && p.of) sub = `Round ${p.rep} of ${p.of}`; else if (p.rep) sub = `Round ${p.rep}`;
    const nx = PH[idx + 1]; if (nx) sub += (sub ? ' · ' : '') + `next: ${nx.label} ${hms(nx.sec * 1000)}`;
  } else sub = 'Target reached. Keep going or press Finish.';
  $('#tmS').textContent = sub;
  $('#tmB').style.width = (idx >= PH.length ? 100 : (1 - rem / dur) * 100) + '%';
  $('#tmE').textContent = hms(el);
  const km = T.gps > 0 ? T.gps : T.laps * S.settings.loopKm;
  $('#tmK').textContent = km > 0 ? (Math.round(km * 100) / 100) : (T.task.km ? '/' + T.task.km : '–');
  if (fuelOn(T.task)) { const nextAt = (30 + 35 * T.fuel) * 60000; $('#tmF').textContent = hms(nextAt - el); }
  else $('#tmF').textContent = T.task.km ? T.task.km + ' km' : (T.task.min ? T.task.min + ' min' : '–');
  $('#tmPause').textContent = T.paused ? '▶ Resume' : '⏸ Pause';
}
function stopTimerRuntime() { clearInterval(tInt); tInt = null; wakeOff(); gpsStop(); $('#timer').style.display = 'none'; try { speechSynthesis.cancel(); } catch (e) {} }

function gpsStart() {
  if (!S.settings.gps || !navigator.geolocation || geoId !== null) return;
  lastPos = null;
  geoId = navigator.geolocation.watchPosition(p => {
    const T = S.timer; if (!T || T.paused) { lastPos = null; return; }
    const { latitude: la, longitude: lo, accuracy: ac } = p.coords; if (ac > 35) return;
    if (lastPos) { const k = hav(lastPos, [la, lo]); if (k > 0.004 && k < 0.25) T.gps = (T.gps || 0) + k; else if (k < 0.004) return; }

let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function beep(f, d, when) {

/* confetti */
function confetti(n) {
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#ff6b2c', '#fbbf24', '#a3e635', '#38bdf8', '#a78bfa', '#f43f5e'];
  const P = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, c: cols[Math.random() * cols.length | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  let f = 0;
  (function fr() {
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(fr); else x.clearRect(0, 0, innerWidth, innerHeight);

}

  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Road to 7 January//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Road to 7 January'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  for (let n = Math.max(dn(START), dn(today())); n <= dn(S.raceDate); n++) {
    const d = ds(n), p = basePlan(d);
    const main = p.tasks.filter(t => t.kind !== 'rest');
    if (!main.length) continue;
    const dt = d.replace(/-/g, '') + 'T' + hh + mm + '00';
    const summary = (d === S.raceDate ? '🎂🏁 ' : '🏃 ') + main.map(t => t.title).join(' + ');
    lines.push('BEGIN:VEVENT', 'UID:' + d + '@road7jan', 'DTSTAMP:' + stamp, 'DTSTART:' + dt, 'DURATION:PT' + (d === S.raceDate ? '6H' : '45M'),
      'SUMMARY:' + esI(summary), 'DESCRIPTION:' + esI(main.map(t => t.title + ': ' + describe(t)).join('\n') + '\nOpen the Road to 7 January app to check in.'),
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esI(summary), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  download('road-to-7-january.ics', lines.join('\r\n'), 'text/calendar');
}
function download(name, text, type) {
  const b = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------------- actions */
const A = {
  'sheet-close': () => closeSheet(),
  tab: el => { TAB = el.dataset.t; render(); scrollTo(0, 0); if (TAB === 'journey') { const r = $('#todayRow'); if (r) r.scrollIntoView({ block: 'center' }); } },
  'ob-mode': el => { S.mode = el.dataset.v; const n = $('#obName'); if (n) S.name = n.value.trim(); render(); },
  'ob-go': () => { S.name = ($('#obName').value || '').trim(); S.onboarded = true; if (!S.created || dn(S.created) > dn(today())) S.created = today(); save(); render(); confetti(160); toast('🔥 Game on! Do your first check-in.'); },
  ci: el => { CI[el.dataset.k] = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  'ci-submit': () => {
    if (!CI.sleep || !CI.legs || !CI.pain) { toast('Answer all 3 questions'); return; }
    const d = today(), v = verdict(d, CI), L = LG(d);
    L.ci = Object.assign({ at: Date.now() }, CI); L.adj = v.adj; L.verdict = { level: v.level, msgs: v.msgs };
    CI = {}; save(); render(); buzz([40]);
    toast(v.level === 'green' ? '✅ Orders received' : v.level === 'amber' ? '🟡 Mission adjusted' : '🛑 Rest ordered');
  },
  'ci-redo': () => { const L = S.logs[today()]; if (L) { delete L.ci; delete L.adj; delete L.verdict; save(); } render(); },
  start: el => {
    const d = el.dataset.d, t = findTask(d, el.dataset.id); if (!t) return;
    if (t.kind === 'run') {
      openSheet(`<h3 style="font-size:20px">${t.emoji} ${esc(t.title)}</h3><p class="muted">How do you want to run it?</p>
        <button class="btn primary block" style="padding:15px" data-a="start-mode" data-d="${d}" data-id="${t.id}" data-m="rw">🏃🚶 Run 5 min / walk 1 min</button>
        <button class="btn block" style="padding:15px;margin-top:10px" data-a="start-mode" data-d="${d}" data-id="${t.id}" data-m="cont">🏃 Continuous easy run</button>`);
    } else startTimer(d, t, 'rw');
  },
  'start-mode': el => { closeSheet(); startTimer(el.dataset.d, findTask(el.dataset.d, el.dataset.id), el.dataset.m); },
  log: el => { const t = findTask(el.dataset.d, el.dataset.id); if (t) logSheet(el.dataset.d, t); },
  lgpain: el => { LOGP.pain = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  'log-save': () => {
    const t = findTask(LOGP.d, LOGP.id); if (!t) return closeSheet();
    const data = {};
    const km = $('#lgKm'), mn = $('#lgMin'), rd = $('#lgRounds'), nt = $('#lgNote');
    if (km && km.value !== '') data.km = Math.round(parseFloat(km.value) * 100) / 100;
    if (mn && mn.value !== '') data.min = Math.round(parseFloat(mn.value));
    if ($('#lgRpe')) data.rpe = LOGP.rpe;
    if (km) data.pain = LOGP.pain;
    if (rd) data.rounds = clamp(parseInt(rd.value || '0', 10), 0, 3);
    if (nt && nt.value.trim()) data.note = nt.value.trim();
    if (isRun(t) && !data.km && !data.min) { toast('Add distance or time'); return; }
    completeTask(LOGP.d, t, data);
  },
  skip: el => { const t = findTask(el.dataset.d, el.dataset.id); if (t) skipSheet(el.dataset.d, t); },
  'skip-reason': el => { LOGP.reason = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  'skip-save': () => {
    if (!LOGP.reason) { toast('Pick a reason'); return; }
    const t = findTask(LOGP.d, LOGP.id); if (!t) return closeSheet();
    LG(LOGP.d).tasks[t.id] = { status: 'skipped', reason: LOGP.reason, kind: t.kind, title: t.title, at: Date.now() };
    if (LOGP.reason === 'injured') { S.injuryUntil = add(LOGP.d, 2); if (!S.injuryStart) S.injuryStart = LOGP.d; }
    if (LOGP.reason === 'ill') S.injuryUntil = add(LOGP.d, 1);
    save(); closeSheet(); render();
    openSheet(`<h3>🧠 Coach</h3><p>${SKIP_MSG[LOGP.reason]}</p><button class="btn primary block" data-a="sheet-close">OK</button>`);
  },
  undo: el => { const L = S.logs[el.dataset.d]; if (L && L.tasks) delete L.tasks[el.dataset.id]; save(); closeSheet(); render(); toast('Undone'); },
  claim: el => {
    const d = el.dataset.d, t = findTask(d, el.dataset.id); if (!t) return;
    completeTask(d, t, {});
  },
  day: el => {
    const d = el.dataset.d, p = plan(d), T = today();
    const L = S.logs[d];
    openSheet(`<h3 style="font-size:20px">${fmtLong(d)}</h3><p class="muted small">${esc(p.phase)}${p.note ? ' · ' + esc(p.note) : ''}</p>
      ${L && L.verdict ? `<div class="card verdict ${L.verdict.level}" style="margin-top:6px"><b>Coach said:</b><ul>${L.verdict.msgs.filter(m => m !== 'BACKUP').map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}
      ${p.tasks.map(t => taskCard(d, t, { locked: d === T && !(L && L.ci) && dn(d) >= dn(START) })).join('')}
      ${dn(d) < dn(T) ? '<p class="muted small" style="margin-top:12px">Forgot to log a past day? You can back-fill it here.</p>' : ''}`);
  },
  'move-long': el => { const d = today(), from = el.dataset.from; LG(d).moveLong = from; LG(from).movedTo = d; save(); render(); toast('⛰️ Long run moved to today'); },
  'no-move': () => { LG(today()).noMove = true; save(); render(); },
  str: el => { const t = findTask(el.dataset.d, el.dataset.id); if (t) strSheet(el.dataset.d, t); },
  'str-cell': el => { STR.done[el.dataset.k] = !STR.done[el.dataset.k]; drawStr(); },
  'str-done': () => {
    const t = findTask(STR.d, STR.id); if (!t) return closeSheet();
    let rounds = 0; for (let r = 0; r < STR.rounds; r++) if (EX.every((_, i) => STR.done[i + '-' + r])) rounds++;
    if (rounds === 0 && !Object.keys(STR.done).length) { toast('Tick the exercises as you go'); return; }
    completeTask(STR.d, t, { rounds: Math.max(rounds, 1) });
  },
  prep: el => { const t = findTask(el.dataset.d, el.dataset.id); if (t) prepSheet(el.dataset.d, t); },
  'prep-item': el => { const k = el.dataset.k; PREP.done[k] = !PREP.done[k]; LG(PREP.d)['prep_' + PREP.id] = PREP.done; save(); drawPrep(); },
  'prep-done': () => { const t = findTask(PREP.d, PREP.id); if (t) completeTask(PREP.d, t, { items: Object.values(PREP.done).filter(Boolean).length }); },
  boss: el => { const t = findTask(el.dataset.d, el.dataset.id); if (t) bossSheet(el.dataset.d, t); },
  'boss-ans': el => { BOSS.ans[el.dataset.k] = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  'boss-fight': () => { if (!BOSS.ans.q1 || !BOSS.ans.q2) { toast('Answer both questions'); return; } bossResult(); },
  'boss-choice': el => {
    const { n, d, id } = BOSS; const t = findTask(d, id);
    S.bosses[n] = { result: 'fail', d: today(), choice: el.dataset.v };
    if (el.dataset.v === 'half') S.mode = 'half'; else S.riskAccepted = true;
    const tt = Object.assign({}, t, { xp: 150 });
    completeTask(d, tt, {});
    if (el.dataset.v === 'half') toast('🦸 New goal: Birthday Half Marathon');
  },
  chk: el => { const k = el.dataset.k; S.raceChecklist[k] = !S.raceChecklist[k]; save(); render(); },
  'race-move': el => {
    const to = el.dataset.to;
    if (to === S.raceDate) return;
    if (!confirm('Set your race day to ' + fmtLong(to) + '?')) return;
    S.raceDate = to; save(); closeSheet(); render(); toast('🏁 Race day: ' + fmt(to));
  },
  mode: el => {
    const v = el.dataset.v; if (v === S.mode) return;
    if (!confirm(v === 'half' ? 'Switch to the Birthday HALF marathon (21.1 km)? Long runs will be capped.' : 'Switch to the FULL marathon (42.2 km)?')) return;
    S.mode = v; save(); render();
  },
  set: el => { const k = el.dataset.k; S.settings[k] = !S.settings[k]; save(); render(); if (k === 'gps' && S.settings.gps && navigator.geolocation) navigator.geolocation.getCurrentPosition(() => toast('📍 GPS ready'), e => toast('📍 ' + e.message)); },
  'save-name': () => { S.name = $('#meName').value.trim(); save(); render(); toast('Saved'); },
  'save-loop': () => { const v = parseFloat($('#loopKm').value); if (v > 0.2) { S.settings.loopKm = Math.round(v * 100) / 100; save(); render(); toast('Loop: ' + S.settings.loopKm + ' km'); } },
  ics: () => icsExport(),
  export: () => download('road-to-7-jan-backup-' + today() + '.json', JSON.stringify(S, null, 1), 'application/json'),
  import: () => { const f = $('#importFile'); f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || typeof o.logs !== 'object') throw 0; if (!confirm('Replace this phone’s progress with the backup?')) return; S = Object.assign(defState(), o); S.settings = Object.assign(defState().settings, o.settings || {}); save(); render(); toast('✅ Backup restored'); } catch (e) { toast('❌ Not a valid backup file'); } }; r.readAsText(file); }; f.click(); },
  reset: () => { if (confirm('Delete ALL progress and start again?') && confirm('Really? This cannot be undone.')) { localStorage.removeItem(KEY); S = defState(); TAB = 'today'; save(); render(); } },
  't-pause': () => { const T = S.timer; if (!T) return; if (T.paused) { T.pausedMs += Date.now() - T.paused; T.paused = null; say('Resume.'); wakeOn(); } else { T.paused = Date.now(); say('Paused.'); } save(); tick(); },
  't-skip': () => { const T = S.timer; if (!T) return; const eff = tEl() + T.skipMs; let acc = 0; for (const p of PH) { acc += p.sec * 1000; if (eff < acc) { T.skipMs += acc - eff; break; } } save(); tick(); },
  't-lap': () => { const T = S.timer; if (!T) return; T.laps++; save(); say('Loop ' + T.laps + ' done. ' + Math.round(T.laps * S.settings.loopKm * 10) / 10 + ' kilometres.'); buzz([80]); tick(); },
  't-sound': el => { S.settings.voice = !S.settings.voice; S.settings.beep = S.settings.voice; save(); el.textContent = S.settings.voice ? '🔊' : '🔇'; },
  't-finish': () => {
    const T = S.timer; if (!T) return;
    const min = Math.max(1, Math.round(tEl() / 60000));
    const km = T.gps > 0 ? Math.round(T.gps * 100) / 100 : (T.laps ? Math.round(T.laps * S.settings.loopKm * 100) / 100 : (T.task.km || ''));
    const d = T.d, id = T.id, task = findTask(d, id) || T.task;
    S.timer = null; save(); stopTimerRuntime();
    logSheet(d, task, { km, min });
  },
  't-cancel': () => { if (!confirm('Stop this workout without logging it?')) return; S.timer = null; save(); stopTimerRuntime(); render(); },
  noop: () => {}
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) f(el, e);
});

/* keep "today" fresh if the app stays open past midnight */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!S.timer) render(); } }, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.timer && !S.timer.paused) wakeOn();
  if (today() !== lastDay) { lastDay = today(); if (!S.timer) render(); }
});

render();
if (S.timer) openTimer();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
