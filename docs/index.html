<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7 Jan">
<title>Road to 7 January</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b2c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='white'%3E7%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1014; --card:#171a21; --card2:#1f232c; --line:#2a2f3a;
  --text:#f3f4f6; --muted:#9aa3b2;
  --orange:#ff6b2c; --lime:#a3e635; --blue:#38bdf8; --red:#f43f5e; --gold:#fbbf24; --purple:#a78bfa;
  --run:#ff6b2c; --walk:#0ea5a4;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
h1,h2,h3{margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header .in{max-width:560px;margin:0 auto}
.hname{font-weight:800;font-size:15px}
.hstats{display:flex;gap:12px;font-size:13px;font-weight:700;color:var(--muted)}
.hstats b{color:var(--text)}
.xpbar{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:9px;transition:width .6s}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h3{font-size:17px;margin-bottom:6px}
.hero{margin-top:14px;border-radius:24px;padding:20px;background:radial-gradient(120% 120% at 100% 0%,#3a1d10 0%,#1a1410 45%,var(--card) 100%);border:1px solid #3a2a20;position:relative;overflow:hidden}
.hero .big{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px}
.hero .lab{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
.hero .cake{position:absolute;right:14px;top:10px;font-size:54px;opacity:.9}
.phase{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(255,107,44,.15);color:#ffb08a}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#111}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.lnk{color:var(--blue);font-weight:700;font-size:13px;padding:6px 4px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip.on{background:rgba(255,107,44,.18);border-color:var(--orange);color:#fff}
.q{font-weight:700;font-size:14px;margin-top:4px}

/* tasks */
.task{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-top:10px}
.task.done{opacity:.75;border-color:#2f4a1a}
.task .te{font-size:30px;line-height:1}
.task .tt{font-weight:800;font-size:16px}
.task .td{color:var(--muted);font-size:14px;margin-top:4px}
.task .ta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.task .tadj{font-size:12px;color:var(--gold);margin-top:6px}
.xp{display:inline-block;font-size:12px;font-weight:800;color:var(--gold);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:7px 11px;border-radius:99px}
.pill.ok{background:rgba(163,230,53,.15);color:var(--lime)}
.pill.bad{background:rgba(244,63,94,.15);color:#fda4af}
.pill.info{background:rgba(56,189,248,.15);color:#7dd3fc}
.lock{font-size:13px;color:var(--muted);font-weight:700}
.k-long{border-color:#5b3a1e;background:linear-gradient(135deg,#2a1d14,var(--card2))}
.k-race{border-color:var(--gold);background:linear-gradient(135deg,#3b2c0a,var(--card2))}
.k-boss{border-color:#5b3fa0;background:linear-gradient(135deg,#231a3a,var(--card2))}

.verdict{border-left:4px solid var(--lime)}
.verdict.amber{border-left-color:var(--gold)}
.verdict.red{border-left-color:var(--red)}
.verdict ul{margin:6px 0 0;padding-left:18px}
.verdict li{margin:4px 0}

/* journey */
.prog{height:14px;border-radius:9px;background:var(--card2);position:relative;margin:26px 0 8px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--orange),var(--gold))}
.prog .me{position:absolute;top:-24px;font-size:22px;transform:translateX(-50%)}
.prog .fin{position:absolute;right:-4px;top:-24px;font-size:22px}
.wk{margin-top:18px}
.wk h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.day{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-top:6px}
.day.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.day .dd{width:78px;font-size:13px;font-weight:700;color:var(--muted)}
.day .dt{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ds{font-size:18px}

/* stats */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;background:var(--card2);border-radius:14px;padding:10px 4px}
.bdg .e{font-size:28px}
.bdg .n{font-size:11px;font-weight:800;margin-top:4px}
.bdg.off{opacity:.3;filter:grayscale(1)}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .e{font-size:46px}

/* guide */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;padding:0 14px}
summary{padding:14px 0;font-weight:800;list-style:none;cursor:pointer}
summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
details .body{padding-bottom:14px;color:#d6dae2;font-size:15px}
details table{width:100%;border-collapse:collapse;font-size:14px}
details td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.check .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.check.on .bx{background:var(--lime);border-color:var(--lime);color:#111}
.check.on span:last-child{color:var(--muted);text-decoration:line-through}

/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
nav button .i{font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--text)}
nav button.on .i{filter:none;opacity:1}

/* sheet */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease}
#sheet.open{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet .in{max-width:560px;margin:0 auto}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--orange)}
.rpe{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* timer */
#timer{position:fixed;inset:0;z-index:60;display:none;background:var(--run);color:#fff;transition:background .4s}
#timer.walk{background:var(--walk)}
#timer.done{background:#16a34a}
#timer.paused{background:#3f3f46}
.tm{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.tm-top{display:flex;align-items:center;gap:10px}
.tm-top button{font-size:22px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.18)}
.tm-title{flex:1;text-align:center;font-weight:800;font-size:15px;opacity:.95}
.tm-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tm-phase{font-size:64px;font-weight:900;letter-spacing:2px;line-height:1}
.tm-count{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:6px}
.tm-sub{font-size:17px;font-weight:700;opacity:.9;margin-top:8px}
.tm-bar{height:10px;background:rgba(0,0,0,.2);border-radius:9px;overflow:hidden;width:100%;margin-top:20px}
.tm-bar i{display:block;height:100%;background:#fff;border-radius:9px}
.tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;width:100%}
.tm-grid div{background:rgba(0,0,0,.16);border-radius:14px;padding:10px}
.tm-grid b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tm-grid span{font-size:12px;font-weight:700;opacity:.85}
.tm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm-btns button{padding:16px;border-radius:16px;background:rgba(0,0,0,.2);font-weight:800;font-size:17px}
.tm-btns button.primary{background:#fff;color:#111}
.tm-btns button.wide{grid-column:1/-1}
.tm-tip{text-align:center;font-size:12px;opacity:.8;margin:10px 0 0}

/* misc */
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.cert{margin-top:14px;border-radius:24px;padding:24px 20px;text-align:center;background:linear-gradient(160deg,#3b2c0a,#1b1508 60%,#111);border:2px solid var(--gold)}
.cert h2{font-size:30px;margin:8px 0}
.cert .km{font-size:56px;font-weight:900;color:var(--gold);line-height:1}
.celebrate{text-align:center}
.celebrate .xpbig{font-size:54px;font-weight:900;color:var(--gold)}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.onb h1{font-size:40px;letter-spacing:-1px}
.onb .rule{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.onb .rule b{font-size:26px}
.sep{height:1px;background:var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheetBg" data-a="sheet-close"></div>
<div id="sheet"><div class="grab"></div><div class="in" id="sheetIn"></div></div>
<div id="timer"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
'use strict';
/* =====================================================================
   ROAD TO 7 JANUARY: a marathon training game.
   Single-user, offline-first. All progress is stored on this device.
   ===================================================================== */

const START = '2026-09-26';        // setup weekend (Sat)
const W1 = '2026-09-28';           // Monday of week 1
const TRAIN = '2026-09-29';        // first training day (100 days to go); 26–28 Sep are planning days
const BIRTHDAY = '2027-01-07';     // Thursday: race day
const KEY = 'road7jan.v1';
const Q = new URLSearchParams(location.search);

/* ---------------- dates (all as 'YYYY-MM-DD', calendar maths in UTC) */
const pad = n => String(n).padStart(2, '0');
const dn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const ds = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const add = (s, k) => ds(dn(s) + k);
const wd = s => new Date(dn(s) * 864e5).getUTCDay();
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = s => { const [, m, d] = s.split('-').map(Number); return DOW[wd(s)] + ' ' + d + ' ' + MON[m - 1]; };
const fmtLong = s => { const [y, m, d] = s.split('-').map(Number); return DOWL[wd(s)] + ' ' + d + ' ' + MON[m - 1] + ' ' + y; };
function today() {
  const o = Q.get('date');
  if (o && /^\d{4}-\d\d-\d\d$/.test(o)) return o;           // preview/testing: ?date=2026-11-28
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fm = m => (m % 1 ? Math.floor(m) + '½' : m) + ' min';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x); };
const hmin = min => { min = Math.round(min || 0); const h = Math.floor(min / 60); return h ? h + 'h ' + pad(min % 60) + 'm' : min + ' min'; };

/* ---------------- state */
function defState() {
  return {
    v: 1, name: '', onboarded: false, mode: 'full', raceDate: BIRTHDAY,
    logs: {}, bosses: {}, seen: [], injuryUntil: null, injuryStart: null, riskAccepted: false,
    settings: { voice: true, beep: true, vibrate: true, gps: false, loopKm: 5, remind: '07:00' },
    raceChecklist: {}, timer: null, created: today(),
    profile: {}, sched: [], weekAdj: {}, weights: [], reviews: {}
  };
}
let S;
try { S = Object.assign(defState(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = defState(); }
S.settings = Object.assign(defState().settings, S.settings || {});
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  queueSync();
}
/* cloud sync: when this page runs on claude.ai, progress is also kept in the artifact's database */
let DB = null, lastSynced = '', syncT = null, syncing = false;
const syncable = () => { const o = Object.assign({}, S); delete o.timer; delete o.savedAt; return JSON.stringify(o); };
function queueSync() { if (!DB) return; clearTimeout(syncT); syncT = setTimeout(pushDb, 1500); }
async function pushDb() {
  if (!DB || syncing) return;
  const cur = syncable(); if (cur === lastSynced) return;
  syncing = true;
  try { await DB.doc('game/state').set({ json: cur, savedAt: S.savedAt || Date.now() }); lastSynced = cur; }
  catch (e) { if (e && e.code === 'unavailable') setTimeout(pushDb, 4000 + Math.random() * 2000); }
  syncing = false;
  if (syncable() !== lastSynced) queueSync();
}
async function dbInit() {
  if (!window.claude || !window.claude.use) return;
  try { DB = await window.claude.use('db'); } catch (e) { DB = null; }
  if (!DB) return;
  try {
    const snap = await DB.doc('game/state').get();
    const r = snap.exists ? snap.data() : null;
    if (r && r.json && (r.savedAt || 0) > (S.savedAt || 0)) {
      const remote = JSON.parse(r.json), timer = S.timer;
      S = Object.assign(defState(), remote); S.settings = Object.assign(defState().settings, remote.settings || {});
      S.timer = timer; S.savedAt = r.savedAt;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      lastSynced = syncable(); render(); toast('☁️ Progress loaded from your account');
    } else if (r && r.json) { lastSynced = r.json; if (r.json !== syncable() && S.onboarded) queueSync(); }
  } catch (e) {}
}

/* in-page confirmation (dialog boxes are blocked in some viewers) */
let CONF = null;
function askConfirm(msg, yes, no) {
  return new Promise(res => {
    CONF = res;
    openSheet(`<h3 style="font-size:19px;margin-bottom:16px">${esc(msg)}</h3><div class="row"><button class="btn primary grow" data-a="conf" data-v="1">${esc(yes || 'Yes')}</button><button class="btn grow" data-a="conf" data-v="0">${esc(no || 'Cancel')}</button></div>`);
  });
}
const LG = d => S.logs[d] || (S.logs[d] = { tasks: {} });
const tl = (d, id) => S.logs[d] && S.logs[d].tasks && S.logs[d].tasks[id];
let TAB = 'today';

/* ---------------- task builders */
function tIv(r, w, n, o) { return Object.assign({ kind: 'intervals', iv: { run: r, walk: w, reps: n, warm: 5, cool: 5 }, min: 10 + Math.round(n * (r + w)), xp: 100, emoji: '🏃', title: `Run-walk · ${n} × (${fm(r)} run / ${fm(w)} walk)` }, o || {}); }
function tLongTime(total, r, w) { const n = Math.floor(total / (r + w)); return tIv(r, w, n, { long: true, xp: 150, emoji: '⛰️', title: `LONG run-walk · ${n * (r + w)} min (${fm(r)} run / ${fm(w)} walk)` }); }
function tRun(km, o) { return Object.assign({ kind: 'run', km, xp: Math.round(100 + 10 * km), emoji: '👟', title: `Easy run · ${km} km` }, o || {}); }
function tJog(min, o) { return Object.assign({ kind: 'run', min, xp: 80, emoji: '👟', title: `Easy jog · ${min} min` }, o || {}); }
function tLong(km, o) { return Object.assign({ kind: 'long', km, xp: Math.round(150 + 15 * km), emoji: '⛰️', title: `LONG RUN · ${km} km` }, o || {}); }
function tWalk(min, title) { return { kind: 'walk', min, xp: 40, emoji: '🚶', title: title || `Brisk walk · ${min} min` }; }
function tStr(light) { return { kind: 'strength', light: !!light, xp: light ? 40 : 60, emoji: '💪', title: light ? 'Light strength · 1–2 rounds' : 'Strength circuit · 3 rounds' }; }
function tRest(title, detail) { return { kind: 'rest', xp: 20, emoji: '😴', title: title || 'Rest day', detail }; }
function tRace(km) { return { kind: 'race', km, xp: 1000, emoji: '🎂', title: km > 40 ? 'BIRTHDAY MARATHON · 42.2 km' : 'BIRTHDAY HALF MARATHON · 21.1 km' }; }
function tBoss(n) { return { kind: 'boss', n, xp: 300, emoji: n === 1 ? '👾' : '🐉', title: `BOSS BATTLE · Checkpoint ${n}` }; }
function tPrep(title, items, xp, key) { return { kind: 'prep', title, items, xp: xp || 50, emoji: '🎒', key }; }
function tPlan(n) { const Z = PLANS[n]; return { kind: 'plan', n, key: 'plan' + n, xp: 150, emoji: Z.emoji, title: 'Planning day ' + n + ' · ' + Z.title }; }

/* ---------------- the training plan */

const JOG_SHIFT = { j0: 0, j2: 0, j5: 1, j10: 2, j20: 2 };

/* plan with coach adjustments applied */
function scaleTask(t, f) {
  const c = Object.assign({}, t, { scaled: (t.scaled || 1) * f, origTitle: t.origTitle || t.title });
  if (t.kind === 'intervals') {
    c.iv = Object.assign({}, t.iv, { reps: Math.max(2, Math.round(t.iv.reps * f)) });
    const mins = Math.round(c.iv.reps * (c.iv.run + c.iv.walk));
    c.min = 10 + mins;
    c.title = t.title.replace(/\d+ ×/, c.iv.reps + ' ×').replace(/· \d+ min \(/, '· ' + mins + ' min (');
  } else if (t.km) {
    c.km = Math.max(1, Math.round(t.km * f * 2) / 2);
    c.title = t.title.replace(/[\d.]+ km/, c.km + ' km');
  } else if (t.min) {
    c.min = Math.max(10, Math.round(t.min * f));
    c.title = t.title.replace(/\d+ min/, c.min + ' min');
  }
  return c;
}
function applyAdj(p, a) {
  if (a.type === 'rest') {
    p.tasks = p.tasks.filter(t => ['boss', 'prep', 'plan', 'review', 'weigh'].includes(t.kind));
    p.tasks.unshift(Object.assign(tRest('Coach says: REST 🛑', a.why || 'Recovery comes first. Rest today.'), { id: p.date + '#r' }));
  } else if (a.type === 'walk') {
    p.tasks = p.tasks.filter(t => t.kind !== 'strength').map(t => isRun(t) ? Object.assign(tWalk(20, 'Easy walk instead of the run'), { id: t.id, origTitle: t.title }) : t);
  } else if (a.type === 'scale' && a.f < 1) {
    p.tasks = p.tasks.map(t => isRun(t) ? scaleTask(t, a.f) : t);
  }
}
function plan(d) {
  const p = basePlan(d);
  p.tasks.forEach((t, i) => { t.id = d + '#' + (t.key || i); });
  const L = S.logs[d];
  if (L && L.moveLong) {
    const src = basePlan(L.moveLong).tasks.find(isLongT);
    if (src) { src.id = d + '#m'; src.movedFrom = L.moveLong; p.tasks = p.tasks.filter(t => !isRun(t) && t.kind !== 'rest' && t.kind !== 'walk'); p.tasks.unshift(src); }
  }

  if (wf && wf < 1 && dn(d) >= dn(TRAIN) && d !== S.raceDate) p.tasks = p.tasks.map(t => isRun(t) ? scaleTask(t, wf) : t);
  if (L && L.adj && d !== S.raceDate) applyAdj(p, L.adj);
  if (L && L.movedTo) p.tasks.forEach(t => { if (isLongT(t)) t.moved = L.movedTo; });

}
const isDone = (d, t) => { const r = tl(d, t.id); return !!r && r.status === 'done'; };

/* ---------------- day status, streaks, XP */
function dayStatus(d) {
  const T = today();

  const p = plan(d);
  let need = 0, done = 0, core = 0, coreDone = 0, claimed = false;
  for (const t of p.tasks) {
    if (t.kind === 'rest') { if (isDone(d, t)) claimed = true; continue; }
    if (t.moved) continue;

    if (t.kind !== 'strength' && t.kind !== 'prep') { core++; if (ok) coreDone++; }
  }
  if (need === 0) return (d === T && !claimed) ? 'rest-today' : 'rest';

  if (core > 0 && coreDone === core) return 'partial-ok';

}

}

}

  let x = 0; const T = today();

}
const LEVELS = [[0, 'Couch Starter', '🛋️'], [300, 'Walker', '🚶'], [800, 'Jogger', '👟'], [1600, 'Runner', '🏃'], [2800, 'Long Hauler', '⛰️'], [4200, 'Half Hero', '🦸'], [6000, 'Road Warrior', '⚔️'], [8200, 'Distance Beast', '🐺'], [10500, 'Marathoner', '🏅'], [13000, 'Legend', '👑']];
function levelInfo(x) {

  const c = LEVELS[i], nx = LEVELS[i + 1];

function stats() {

  for (const d in S.logs) {
    const L = S.logs[d];
    for (const id in (L.tasks || {})) {
      const r = L.tasks[id]; if (r.status !== 'done') continue;

function newBadges() {
  const st = stats();
  const got = BADGES.filter(b => b[4](st)).map(b => b[0]);
  const fresh = got.filter(id => !S.seen.includes(id));
  if (fresh.length) { S.seen.push(...fresh); save(); }
  return fresh.map(id => BADGES.find(b => b[0] === id));

/* ---------------- the coach */
function lastRunBefore(d) {
  for (let n = dn(d) - 1; n >= dn(START); n--) {
    const L = S.logs[ds(n)]; if (!L) continue;
    for (const id in (L.tasks || {})) { const r = L.tasks[id]; if (r.status === 'done' && ['intervals', 'run', 'long'].includes(r.kind)) return ds(n); }
  }
  return null;
}
function recentHard(d) {
  const rs = [];
  for (let n = dn(d) - 1; n >= dn(d) - 10 && rs.length < 2; n--) {
    const L = S.logs[ds(n)]; if (!L) continue;
    for (const id in (L.tasks || {})) { const r = L.tasks[id]; if (r.status === 'done' && ['intervals', 'run', 'long'].includes(r.kind) && r.rpe) rs.push(+r.rpe); }
  }

}
function verdict(d, ci) {
  const msgs = []; let adj = null, level = 'green';
  const base = basePlan(d);
  const hasRun = base.tasks.some(isRun);
  const isRace = d === S.raceDate;

  if (isRace) {
    if (ci.pain !== 'none' || ci.legs === 'hurt') {
      level = 'red';
      msgs.push('🚨 Do not run 42 km on an injury. Move your race to the backup date and rest today.');
      msgs.push('BACKUP');
    } else {
      if (ci.sleep === 'bad') msgs.push('😴 Bad sleep before a race is normal. It’s the sleep from 2 nights ago that counts.');
      msgs.push('🎂 Happy birthday! Everything is green. Run 5 / walk 1 from the very first minute, and start slower than feels right.');
    }
    return { adj: null, level, msgs };
  }

  if (ci.pain === 'sharp') {
    S.injuryUntil = add(d, 2); if (!S.injuryStart) S.injuryStart = d;
    adj = { type: 'rest', why: 'Sharp pain. Injury protocol: rest today and the next 2 days.' }; level = 'red';
    msgs.push('🚨 Sharp pain = stop. Rest today and the next 2 days.');
    msgs.push('If it’s on a bone (shin, foot) or lasts more than 3 days, see a physio or doctor.');
  } else if (S.injuryUntil && dn(d) <= dn(S.injuryUntil)) {
    if (ci.pain === 'none' && ci.legs !== 'hurt') {
      S.injuryUntil = null; S.injuryStart = null;
      adj = hasRun ? { type: 'scale', f: 0.6 } : null; level = 'amber';
      msgs.push('💚 Pain gone, welcome back! Easing you in at 60% today.');
    } else {
      adj = { type: 'rest', why: 'Still recovering. Rest today.' }; level = 'red';
      msgs.push('🛑 Still sore. Rest again today.');
      if (S.injuryStart && dn(d) - dn(S.injuryStart) >= 3) msgs.push('⚠️ It’s been 3+ days. Please book a physio or GP appointment.');
      S.injuryUntil = add(d, 1);
    }
  } else if (ci.pain === 'niggle' || ci.legs === 'hurt') {
    adj = hasRun ? { type: 'walk' } : null; level = 'amber';
    msgs.push(hasRun ? '⚠️ Niggle detected. Today’s run becomes an easy 20-min walk. No strength work on the sore area.' : '⚠️ Niggle noted. Good thing it’s a rest day.');
    msgs.push('Ice/heat, gentle stretching, and check in honestly tomorrow.');
  } else {
    let f = 1;
    if (ci.legs === 'sore') { f = Math.min(f, 0.7); msgs.push('🥵 Sore legs: run cut to 70% today.'); }
    if (ci.sleep === 'bad') { f = Math.min(f, 0.75); msgs.push('😫 Short sleep: run trimmed to protect you. Early night tonight!'); }
    const last = lastRunBefore(d);
    const baseline = dn(TRAIN) > dn(S.created) ? TRAIN : S.created;
    const gap = dn(d) - dn(last || baseline);
    if (hasRun && dn(d) >= dn(TRAIN) + 5 && gap >= 7) { f = Math.min(f, 0.6); msgs.push(`🔁 Comeback mode: ${gap} days since your last run, so starting at 60%.`); }
    else if (hasRun && dn(d) >= dn(TRAIN) + 5 && gap >= 4) { f = Math.min(f, 0.8); msgs.push(`🔁 ${gap} days since your last run: easing back in at 80%.`); }
    if (recentHard(d)) { f = Math.min(f, 0.8); msgs.push('🐢 Your last runs felt very hard (RPE 8+). Shorter and SLOWER today.'); }
    if (f < 1 && hasRun) { adj = { type: 'scale', f }; level = 'amber'; }
    else if (!hasRun) msgs.push(ci.legs === 'fresh' ? '⚡ Fresh legs on a rest/strength day: bank that energy, don’t add extra runs.' : '✅ All good. Do today’s mission as planned.');
    else msgs.push(ci.legs === 'fresh' && ci.sleep === 'good' ? '✅ All green. Go as planned, still at conversational pace.' : '✅ Good to go. Mission as planned.');
  }
  return { adj, level, msgs };
}

function tipFor(d) {
  const tomorrow = add(d, 1), tp = plan(tomorrow).tasks;
  if (tomorrow === S.raceDate) return '🎂 Tomorrow is THE day. Kit laid out, carb-rich dinner, early night. You are ready.';
  if (tp.some(isLongT)) return '⛰️ Long run tomorrow: carb-rich dinner tonight, lay out your kit, charge your phone, sleep early.';
  if (tp.some(t => t.kind === 'boss')) return '👾 Boss battle tomorrow. Be honest with the coach; it keeps you safe.';
  const n = dn(d);
  const list = n >= dn('2026-12-21') ? TIPS.taper : (n >= dn('2026-10-26') ? TIPS.p2 : TIPS.p1);
  return '💡 ' + list[n % list.length];
}

function describe(t) {
  switch (t.kind) {
    case 'intervals': { const v = t.iv; return `Warm-up 5 min walk → ${v.reps} × (${fm(v.run)} run / ${fm(v.walk)} walk) → 5 min cool-down walk. ≈ ${t.min} min total. Conversational pace.`; }
    case 'run': return t.strides ? 'Easy 4 km. Near the end do 4 × 1 min slightly faster (not a sprint), with 1–2 min easy between.' : (t.km ? 'Conversational pace: you should be able to talk. Walk breaks are fine.' : 'Very easy. Talk-test pace. Walk breaks allowed.');
    case 'long': return `Run 5 min / walk 1 min from the first minute. ${t.km >= 12 ? 'Gel or jelly babies every 30–40 min from 30 min. Sips of water every 15–20 min. ' : ''}Slow is the goal.`;
    case 'walk': return 'Brisk pace, arms swinging. It builds your legs without the pounding.';
    case 'strength': return 'Squats ×12 · Reverse lunges ×10/leg · Glute bridges ×15 · Calf raises ×15 (slow) · Plank 30–45 s · Side plank 20–30 s/side.';
    case 'rest': return t.detail || 'Rest is training: your body gets stronger today. Walk, stretch, sleep well.';
    case 'race': return 'Run 5 / walk 1 from the start. Gel every 30–40 min. Slow first 10 km. Km 30–35 is the hard part, so keep moving. Cake at the finish 🎂';
    case 'boss': return 'Answer honestly. Pass = badge + 300 XP. Fail = the coach adjusts your goal to keep you safe.';
    case 'prep': return t.items.length + ' things to tick off.';
    case 'plan': return PLANS[t.n].intro;
    case 'review': return 'Tell the coach how this week went. Your answers shape next week.';
    case 'weigh': return 'Monday morning, after the toilet, before breakfast, same scale. The trend matters, not one number.';
  }
  return '';
}

function setSched(from, rundays, longday) {
  S.sched = (S.sched || []).filter(x => dn(x.from) < dn(from));
  S.sched.push({ from, rundays: rundays.map(Number).sort((a, b) => a - b), longday: +longday });
}
function addWeight(d, kg) {
  kg = Math.round(+kg * 10) / 10; if (!(kg > 0)) return;
  S.weights = (S.weights || []).filter(w => w.d !== d);
  S.weights.push({ d, kg }); S.weights.sort((a, b) => dn(a.d) - dn(b.d));
}
function weightInfo() {
  const W = S.weights || []; if (!W.length) return null;
  const first = W[0], last = W[W.length - 1], diff = Math.round((last.kg - first.kg) * 10) / 10;
  let msg;
  if (W.length < 2) msg = 'Starting weight saved. Weigh in every Monday: same time, before breakfast.';
  else if (diff <= -0.5) msg = `Down ${Math.abs(diff)} kg since you started. You’re doing great! 🎉`;
  else if (diff < 0.5) msg = 'Holding steady. Your fitness is climbing even when the scale doesn’t move. 💪';
  else msg = `Up ${diff} kg. That’s normal early in training: muscles store extra water and fuel. Watch the trend over several weeks.`;
  const h = +(S.profile || {}).height, bmi = h ? last.kg / Math.pow(h / 100, 2) : 0;
  return { W, first, last, diff, msg, bmi };
}
function weightSvg(W) {
  if (W.length < 2) return '';
  const x0 = dn(W[0].d), x1 = Math.max(dn(W[W.length - 1].d), x0 + 7);
  const ks = W.map(w => w.kg), lo = Math.min(...ks) - 1, hi = Math.max(...ks) + 1;
  const X = n => 30 + (n - x0) / (x1 - x0) * 280, Y = k => 10 + (hi - k) / (hi - lo) * 90;
  const pts = W.map(w => X(dn(w.d)).toFixed(1) + ',' + Y(w.kg).toFixed(1)).join(' ');
  const last = W[W.length - 1];
  return `<svg viewBox="0 0 330 124" width="100%" style="margin-top:8px">
    <line x1="30" y1="100" x2="310" y2="100" stroke="#2a2f3a"/>
    <text x="26" y="${Y(hi - 1) + 4}" font-size="9" fill="#9aa3b2" text-anchor="end">${(hi - 1).toFixed(1)}</text>
    <text x="26" y="${Y(lo + 1) + 4}" font-size="9" fill="#9aa3b2" text-anchor="end">${(lo + 1).toFixed(1)}</text>
    <polyline points="${pts}" fill="none" stroke="#ff6b2c" stroke-width="2.5" stroke-linejoin="round"/>
    ${W.map(w => `<circle cx="${X(dn(w.d)).toFixed(1)}" cy="${Y(w.kg).toFixed(1)}" r="3" fill="#ff6b2c"/>`).join('')}
    <circle cx="${X(dn(last.d)).toFixed(1)}" cy="${Y(last.kg).toFixed(1)}" r="5.5" fill="#fbbf24"/>
    <text x="30" y="116" font-size="9" fill="#9aa3b2">${fmt(W[0].d)}</text><text x="310" y="116" font-size="9" fill="#9aa3b2" text-anchor="end">${fmt(last.d)}</text></svg>`;
}

function progressCard(d) {
  if (dn(d) < dn(TRAIN) || dn(d) > dn(S.raceDate)) return '';
  const wkStart = dn(d) - ((wd(d) + 6) % 7);
  let km = 0, km0 = 0, done = 0, need = 0;
  for (let n = wkStart - 7; n < wkStart + 7; n++) {
    const dd = ds(n), L = S.logs[dd]; if (!L) continue;
    for (const id in (L.tasks || {})) { const r = L.tasks[id]; if (r.status === 'done' && r.km) { if (n >= wkStart) km += +r.km; else km0 += +r.km; } }
  }
  for (let n = dn(TRAIN); n < dn(d); n++) { const dd = ds(n); for (const t of plan(dd).tasks) if (isRun(t) && !t.moved) { need++; if (isDone(dd, t)) done++; } }
  const pct = need ? Math.round(done / need * 100) : 100, st = streak();
  const line = pct >= 85 ? 'You’re doing great. Keep stacking days! 🔥' : pct >= 60 ? 'Solid. Consistency is what gets you to the start line. 👍' : 'Every run from here counts. The coach adapts; just show up. 💪';
  return `<div class="card"><h3>📈 How you’re doing</h3><div class="grid3" style="margin-top:8px">
    <div class="stat"><b>${pct}%</b><span>runs done</span></div><div class="stat"><b>${st}</b><span>day streak</span></div><div class="stat"><b>${Math.round(km * 10) / 10}</b><span>km this week${km0 ? ' (last ' + Math.round(km0) + ')' : ''}</span></div></div>
    <p style="margin:10px 0 0">${line}</p></div>`;
}

function drawQS(top) {

  let h = `<h3 style="font-size:21px">${spec.emoji} ${esc(spec.title)}</h3><p class="muted small">${esc(spec.intro)}</p>`;
  for (const q of spec.qs) {
    if (q.show && !q.show(v)) continue;
    h += `<div class="q" style="margin-top:16px">${esc(q.label)}${q.req ? '' : ' <span class="muted small">(optional)</span>'}</div>`;
    if (q.help) h += `<div class="muted small">${esc(q.help)}</div>`;
    if (q.type === 'num') h += `<div class="row" style="margin-top:6px"><input id="qs_${q.k}" type="number" inputmode="decimal" step="${q.step || 1}" value="${v[q.k] ?? ''}"><span class="muted" style="min-width:44px">${q.unit || ''}</span></div>`;

    else {

    }

  h += `<button class="btn primary block" style="margin-top:14px;padding:15px" data-a="qs-save">${esc(spec.submit || 'Save')}</button>`;

}
function qsValidate() {
  for (const q of QS.spec.qs) {
    if (q.show && !q.show(QS.v)) continue;
    const x = QS.v[q.k];
    if (q.type === 'num' && x !== '' && x !== undefined && (x < q.min || x > q.max)) return `${q.label}: enter ${q.min}–${q.max} ${q.unit || ''}`;
    if (!q.req) continue;
    if (q.type === 'days' && (!x || x.length !== q.count)) return `${q.label}`;
    if ((q.type === 'multi') && (!x || !x.length)) return q.label;
    if (x === undefined || x === '' || x === null) return q.label;
  }
  return '';
}

function reviewSave(d, v) {

  else if (v.feel === 'toohard') { f = 0.8; m.push('🥵 Too hard → next week’s runs are cut to 80%. Slow down: easy runs should feel like 3–5 out of 10.'); }
  else if (v.feel === 'hard' && (v.sleep === 'poor' || v.pain === 'niggle')) { f = 0.9; m.push('😤 Hard week plus ' + (v.sleep === 'poor' ? 'poor sleep' : 'a niggle') + ' → next week trimmed to 90%.'); }
  else if (v.feel === 'hard') m.push('😤 Hard is OK: that’s the training working. Same plan next week, and keep the easy runs truly easy.');
  else if (v.feel === 'right') m.push('👌 Just right. Next week builds a little, as planned.');
  else m.push('😎 Too easy? Great sign, but the plan already builds every week and your tendons need time. Stay patient; the long runs get serious soon.');
  if (v.sleep === 'poor' && f === 1) m.push('😫 Poor sleep is the #1 thing to fix this week. Aim for 7+ hours.');
  if (v.pain === 'niggle' && f !== 0.7) m.push('⚠️ Niggle noted. Check in honestly each morning; the coach will swap runs for walks if needed.');
  if (f < 1) S.weekAdj[next] = f; else delete S.weekAdj[next];
  if (v.sched === 'change') { setSched(add(d, 1), v.rundays, v.longday); m.push('🔁 New week from ' + fmt(add(d, 1)) + ': ' + weekText(add(d, 1))); }
  const prev = S.reviews[wk - 1];
  if (v.feel === 'toohard' && prev && prev.feel === 'toohard' && S.mode === 'full') m.push('💡 Two “too hard” weeks in a row. Consider switching to the Birthday HALF marathon (Me → Goal). No shame, just smart.');
  S.reviews[wk] = { feel: v.feel, pain: v.pain, sleep: v.sleep, note: v.note || '', f };
  return m;
}

function longOffer(d) {
  const L = S.logs[d];
  if (L && (L.moveLong || L.noMove)) return '';

  let sat = null, t = null;
  for (const k of [1, 2]) {
    const pd = add(d, -k); if (dn(pd) < dn(TRAIN)) break;
    const pt = plan(pd).tasks.find(isLongT); if (pt) { sat = pd; t = pt; break; }
    if (S.logs[pd] && S.logs[pd].moveLong) return '';
  }
  if (!t || t.moved || isDone(sat, t)) return '';
  const r = tl(sat, t.id);
  if (r && r.status === 'skipped' && (r.reason === 'injured' || r.reason === 'ill')) return '';
  if (S.logs[sat] && S.logs[sat].adj && S.logs[sat].adj.type === 'rest') return '';

function weekKm() {
  const out = [];
  for (let wk = 0; wk <= 15; wk++) {
    const from = wk === 0 ? dn(START) : dn(W1) + (wk - 1) * 7;
    const to = wk === 0 ? dn(W1) - 1 : from + 6;
    let act = 0, pl = 0;
    for (let n = from; n <= to; n++) {
      const d = ds(n); if (n > dn(S.raceDate)) break;
      for (const t of plan(d).tasks) { if (isRun(t) && t.km && !t.moved) pl += t.km; const r = tl(d, t.id); if (r && r.status === 'done' && r.km) act += +r.km; }
    }
    out.push({ wk, act, pl });
  }
  return out;
}

  if (isRun(t) && t.kind !== 'race' && data.rpe >= 8) msgs.push(`🐢 RPE ${data.rpe}: too hard! Easy runs should feel 3–5/10. Slower = further.`);
  if (isRun(t) && t.km && data.km && data.km < t.km * 0.7 && t.kind !== 'race') msgs.push('Shorter than planned, no drama. Consistency beats heroics.');

/* boss battles */
function bossAuto(n) {
  if (n === 1) {
    let need = 0, done = 0;
    for (let k = dn('2026-10-12'); k <= dn('2026-10-25'); k++) { const d = ds(k); for (const t of plan(d).tasks) if (isRun(t)) { need++; if (isDone(d, t)) done++; } }
    return { ok: need ? done / need >= 0.5 : false, text: `You completed ${done} of ${need} runs in weeks 3–4.` };
  }
  let sat = null, t = null;
  for (let k = dn('2026-11-16'); k <= dn('2026-11-22'); k++) { const pt = plan(ds(k)).tasks.find(isLongT); if (pt && !pt.movedFrom) { sat = ds(k); t = pt; break; } }
  let r = t && tl(sat, t.id);
  if (t && t.moved) r = tl(t.moved, t.moved + '#m');
  const ok = !!r && r.status === 'done' && (+r.km || 0) >= 9;
  return { ok, text: ok ? `You logged ${r.km} km on the 10 km long run. ✅` : 'The 10 km long run (week 8) isn’t logged as done.' };
}
let BOSS = {};
function bossSheet(d, t) {
  const n = t.n, a = bossAuto(n);
  BOSS = { d, id: t.id, n, a, ans: {} };
  const qs = n === 1
    ? [['q1', 'Can you jog 20–30 minutes with only short walk breaks?'], ['q2', 'Any pain that has lasted more than 3 days?']]
    : [['q1', 'Did the 10 km feel comfortable (you could have kept going)?'], ['q2', 'Any pain that has lasted more than 3 days?']];
  openSheet(`<div style="text-align:center;font-size:64px">${t.emoji}</div><h3 style="text-align:center;font-size:22px">Checkpoint ${n}: ${n === 1 ? 'The Habit Guardian' : 'The 10K Dragon'}</h3>

function bossResult() {
  const { n, a, ans } = BOSS;
  const pass = a.ok && ans.q1 === 'yes' && ans.q2 === 'no';
  if (pass) {
    S.bosses[n] = { result: 'pass', d: today() };
    completeTask(BOSS.d, findTask(BOSS.d, BOSS.id), {});

  }
  const why = [];
  if (!a.ok) why.push(n === 1 ? 'Fewer than half of the week 3–4 runs were done.' : 'The 10 km long run isn’t done.');

/* ---------------- workout timer */
let PH = [], tInt = null, lastBeep = -1, wl = null, geoId = null, lastPos = null, lastSave = 0;
function phasesFor(t, mode) {
  const P = [], s = x => Math.round(x * 60);
  if (t.kind === 'intervals') {
    const v = t.iv;
    P.push({ type: 'walk', sec: s(v.warm), label: 'WARM-UP', say: 'Warm up. Brisk walk for five minutes.' });
    for (let i = 1; i <= v.reps; i++) {
      P.push({ type: 'run', sec: s(v.run), label: 'RUN', rep: i, of: v.reps, say: i === v.reps ? 'Last run! Go.' : 'Run.' });
      if (i < v.reps) P.push({ type: 'walk', sec: s(v.walk), label: 'WALK', rep: i, of: v.reps, say: 'Walk.' });
    }
    P.push({ type: 'walk', sec: s(v.cool), label: 'COOL-DOWN', say: 'Great work. Cool down, walk for five minutes.' });
    return P;
  }
  if (t.kind === 'walk') { P.push({ type: 'walk', sec: s(t.min), label: 'WALK', say: 'Brisk walk. Go.' }); return P; }
  if (t.kind !== 'race') P.push({ type: 'walk', sec: 300, label: 'WARM-UP', say: 'Warm up. Brisk walk for five minutes.' });
  if (mode === 'cont') { P.push({ type: 'run', sec: s(t.min || Math.max(20, (t.km || 5) * 8)), label: 'RUN', say: 'Easy run. Conversational pace.' }); return P; }
  for (let i = 1; i <= 300; i++) { P.push({ type: 'run', sec: 300, label: 'RUN', rep: i, say: 'Run.' }); P.push({ type: 'walk', sec: 60, label: 'WALK', rep: i, say: 'Walk. One minute.' }); }
  return P;
}
const fuelOn = t => t.kind === 'race' || (t.kind === 'long' && (t.km || 0) >= 12);
function startTimer(d, t, mode) {
  audio(); // unlock audio on this tap
  S.timer = { d, id: t.id, task: t, mode: mode || 'rw', start: Date.now(), paused: null, pausedMs: 0, skipMs: 0, idx: -1, fuel: 0, laps: 0, gps: 0 };
  save(); openTimer();
}
function openTimer() {
  const T = S.timer; if (!T) return;
  PH = phasesFor(T.task, T.mode);
  const el = $('#timer');
  const showLap = T.task.kind === 'race' || isLongT(T.task);
  el.innerHTML = `<div class="tm"><div class="tm-top"><button data-a="t-cancel" aria-label="Cancel">✕</button><div class="tm-title">${T.task.emoji} ${esc(T.task.title)}</div><button data-a="t-sound" aria-label="Sound">${S.settings.voice ? '🔊' : '🔇'}</button></div>
    <div class="tm-mid"><div class="tm-phase" id="tmP">GO</div><div class="tm-count" id="tmC">00:00</div><div class="tm-sub" id="tmS"></div><div class="tm-bar"><i id="tmB"></i></div>
    <div class="tm-grid"><div><b id="tmE">00:00</b><span>total time</span></div><div><b id="tmK">–</b><span>km</span></div><div><b id="tmF">–</b><span>${fuelOn(T.task) ? 'next fuel' : 'target'}</span></div></div></div>
    <div class="tm-btns"><button data-a="t-pause" id="tmPause">⏸ Pause</button><button data-a="t-skip">⏭ Skip</button>
    ${showLap ? `<button class="wide" data-a="t-lap">🔁 Loop done (+${S.settings.loopKm} km)</button>` : ''}
    <button class="primary wide" data-a="t-finish">✅ Finish &amp; log</button></div>
    <p class="tm-tip">Keep this screen open. It stays awake and speaks your cues.</p></div>`;
  el.style.display = 'block';
  wakeOn(); gpsStart();
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
const tEl = () => { const T = S.timer; return (T.paused || Date.now()) - T.start - T.pausedMs; };
function tick() {
  const T = S.timer; if (!T) return;

function confetti(n) {
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);

  const P = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, c: cols[Math.random() * cols.length | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));

/* calendar export */
function icsExport() {
  const tm = ($('#remind') && $('#remind').value) || S.settings.remind || '07:00';
  S.settings.remind = tm; save();
  const [hh, mm] = tm.split(':');
  const esI = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Road to 7 January//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Road to 7 January'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  for (let n = Math.max(dn(START), dn(today())); n <= dn(S.raceDate); n++) {
    const d = ds(n), p = basePlan(d);
    const main = p.tasks.filter(t => t.kind !== 'rest');
    if (!main.length) continue;
    const dt = d.replace(/-/g, '') + 'T' + hh + mm + '00';
    const summary = (d === S.raceDate ? '🎂🏁 ' : '🏃 ') + main.map(t => t.title).join(' + ');
    lines.push('BEGIN:VEVENT', 'UID:' + d + '@road7jan', 'DTSTAMP:' + stamp, 'DTSTART:' + dt, 'DURATION:PT' + (d === S.raceDate ? '6H' : '45M'),
      'SUMMARY:' + esI(summary), 'DESCRIPTION:' + esI(main.map(t => t.title + ': ' + describe(t)).join('\n') + '\nOpen the Road to 7 January app to check in.'),
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esI(summary), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  }

}

        const c = e && e.code;

        if (c === 'rejected_extension' || c === 'extension_not_enabled') toast('This file type can’t be saved here');
        else if (c === 'rate_limited') toast('A save is already open. Try again in a moment');

}

  't-skip': () => { const T = S.timer; if (!T) return; const eff = tEl() + T.skipMs; let acc = 0; for (const p of PH) { acc += p.sec * 1000; if (eff < acc) { T.skipMs += acc - eff; break; } } save(); tick(); },
  't-lap': () => { const T = S.timer; if (!T) return; T.laps++; save(); say('Loop ' + T.laps + ' done. ' + Math.round(T.laps * S.settings.loopKm * 10) / 10 + ' kilometres.'); buzz([80]); tick(); },
  't-sound': el => { S.settings.voice = !S.settings.voice; S.settings.beep = S.settings.voice; save(); el.textContent = S.settings.voice ? '🔊' : '🔇'; },
  't-finish': () => {
    const T = S.timer; if (!T) return;
    const min = Math.max(1, Math.round(tEl() / 60000));
    const km = T.gps > 0 ? Math.round(T.gps * 100) / 100 : (T.laps ? Math.round(T.laps * S.settings.loopKm * 100) / 100 : (T.task.km || ''));
    const d = T.d, id = T.id, task = findTask(d, id) || T.task;
    S.timer = null; save(); stopTimerRuntime();
    logSheet(d, task, { km, min });
  },
  't-cancel': async () => { if (!(await askConfirm('Stop this workout without logging it?', 'Stop workout', 'Keep going'))) return; S.timer = null; save(); stopTimerRuntime(); render(); },
  noop: () => {}
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) f(el, e);
});

/* keep "today" fresh if the app stays open past midnight */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!S.timer) render(); } }, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.timer && !S.timer.paused) wakeOn();
  if (today() !== lastDay) { lastDay = today(); if (!S.timer) render(); }
});

render();
if (S.timer) openTimer();
dbInit();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
